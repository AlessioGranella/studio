<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lo studio di Alessio Granella</title>
<link rel="icon" href="brand/monogramma-rust.svg">
<meta name="theme-color" content="#0F1821">
<style>
@font-face{font-family:'Augustina';src:url('font/DTAugustinaSlab-3Light.otf') format('opentype');font-weight:300;font-display:swap}
@font-face{font-family:'Augustina';src:url('font/DTAugustinaSlab-3Regular.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'Augustina';src:url('font/DTAugustinaSlab-3Medium.otf') format('opentype');font-weight:500;font-display:swap}
:root{
  /* palette del brand, versione scura */
  --bg:#141F18;          /* tra Ink e Blu-nero */
  --side:#0F1821;        /* Blu-nero */
  --surface:#1A2B1E;     /* Ink */
  --surface-2:#243728;   /* Verde */
  --line:#2C3B30;        /* filetto sottile */
  --line-2:#485349;      /* line-dark */
  --fg:#E4E8E4;          /* on-dark */
  --fg-2:#ADB8AE;        /* on-dark-muted */
  --fg-3:#7D8A7F;
  --accent:#8FAF90;      /* Muschio: l'accento su fondo scuro */
  --accent-soft:rgba(143,175,144,.12);
  --font:'Augustina',Georgia,'Times New Roman',serif;
  --sidew:220px;--pad:28px;
  --ease:cubic-bezier(.2,.7,.2,1);--dur:.16s;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
html,body{height:100%}
body{background:var(--bg);color:var(--fg-2);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;background:none;border:0;cursor:pointer;color:inherit}
::selection{background:var(--accent);color:var(--side)}
.ui{font-size:.68rem;font-weight:500;text-transform:uppercase;letter-spacing:.1em}
.eyebrow{font-size:.66rem;font-weight:500;text-transform:uppercase;letter-spacing:.14em;color:var(--accent)}
em{font-style:normal;color:var(--accent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layout */
.app{display:grid;grid-template-columns:var(--sidew) 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 18px 16px}
.brand img{width:24px;height:24px}
.brand span{color:var(--fg);font-size:.86rem;line-height:1.15}
.nav{padding:8px 10px}
.nav h4{padding:12px 8px 6px;color:var(--fg-3)}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;font-size:.86rem;color:var(--fg-2);transition:background var(--dur),color var(--dur)}
.nav a:hover{color:var(--fg);background:rgba(228,232,228,.04)}
.nav a.on{color:var(--fg);background:var(--accent-soft)}
.nav a.on small{color:var(--accent)}
.nav a small{font-size:.68rem;color:var(--fg-3);font-variant-numeric:tabular-nums}
aside .foot{margin-top:auto;padding:12px 18px 0;font-size:.72rem;color:var(--fg-3);border-top:1px solid var(--line)}

main{min-width:0;padding:0 var(--pad) 40px}
.bar{position:sticky;top:0;z-index:5;background:rgba(20,31,24,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:20px;padding:14px 0;border-bottom:1px solid var(--line)}
.bar .title{min-width:0}
.bar h1{font-weight:300;font-size:1.6rem;letter-spacing:-.03em;line-height:1.05;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .title p{margin-bottom:4px}
.search{margin-left:auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px 0 12px;width:min(340px,40vw);height:34px;transition:border-color var(--dur)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:.9rem;color:var(--fg);min-width:0}
.search input::placeholder{color:var(--fg-3)}
.search kbd{font-family:inherit;font-size:.66rem;color:var(--fg-3);border:1px solid var(--line-2);padding:0 5px}

.view{padding-top:20px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:28px 0 12px}
.sec:first-child{margin-top:0}
.sec h2{font-weight:400;font-size:.95rem;letter-spacing:0;color:var(--fg)}
.sec a,.sec button{color:var(--fg-3)}
.sec a:hover,.sec button:hover{color:var(--accent)}
.lead{max-width:62ch;color:var(--fg-2)}

/* ---------- stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:var(--surface)}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);transition:background var(--dur)}
.stat:last-child{border-right:0}
.stat:hover{background:var(--surface-2)}
.stat b{font-weight:300;font-size:1.9rem;line-height:1.1;letter-spacing:-.03em;color:var(--fg);font-variant-numeric:tabular-nums}
.stat span{color:var(--fg-3)}
.stat.dark b{color:var(--accent)}

/* ---------- cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;transition:border-color var(--dur) var(--ease),transform var(--dur) var(--ease);position:relative;min-width:0}
.card:hover{border-color:var(--line-2);transform:translateY(-2px)}
.thumb{aspect-ratio:16/10;background:var(--side);overflow:hidden;border-bottom:1px solid var(--line);display:block;position:relative;width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;transition:transform .5s var(--ease),opacity var(--dur);opacity:.92}
.card:hover .thumb img{transform:scale(1.04);opacity:1}
.thumb img.v,.mosaic img.v{object-fit:contain;object-position:center;padding:10px 0;background:var(--side)}
.ph{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:12px 14px;background:linear-gradient(var(--surface-2),var(--surface-2));color:var(--fg-3);text-align:left}
.ph b{font-weight:300;font-size:2rem;letter-spacing:-.03em;line-height:1;color:var(--fg-2)}
.ph.c-proposte,.ph.c-finanza{background:var(--side)}
.badge{position:absolute;top:8px;left:8px;background:rgba(15,24,33,.8);backdrop-filter:blur(6px);color:var(--fg);padding:2px 7px;font-size:.6rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.badge.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(143,175,144,.2)}
.cbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.cbody .meta{display:flex;flex-wrap:wrap;gap:2px 8px;color:var(--fg-3);font-size:.6rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
.cbody .meta button{color:var(--fg-2);font-size:inherit;letter-spacing:inherit;font-weight:inherit;text-transform:inherit}
.cbody .meta button:hover{color:var(--accent)}
.cbody h3{font-weight:400;font-size:.93rem;line-height:1.3;color:var(--fg)}
.cbody p{font-size:.8rem;color:var(--fg-3);line-height:1.4}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:10px}
.acts a,.acts button{font-size:.6rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-2);border:1px solid var(--line-2);padding:3px 7px;transition:all var(--dur)}
.acts a:hover,.acts button:hover{color:var(--fg);border-color:var(--fg-2)}
.acts .primary{color:var(--side);background:var(--accent);border-color:var(--accent)}
.acts .primary:hover{color:var(--side);background:var(--fg);border-color:var(--fg)}

/* ---------- category tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;transition:border-color var(--dur) var(--ease),transform var(--dur) var(--ease)}
.tile:hover{border-color:var(--line-2);transform:translateY(-2px)}
.mosaic{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:1px;aspect-ratio:16/7;background:var(--line);overflow:hidden}
.mosaic>*:first-child{grid-row:1/3}
.mosaic img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;opacity:.9}
.mosaic .ph{padding:8px 10px;justify-content:flex-end}
.mosaic .ph span{display:none}
.mosaic .ph b{font-size:1.1rem}
.tile .tb{padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tile h3{font-weight:400;font-size:.9rem;color:var(--fg)}
.tile .n{font-size:.75rem;color:var(--fg-3);font-variant-numeric:tabular-nums}
.tile .d{padding:0 12px 12px;font-size:.78rem;color:var(--fg-3);margin-top:-6px}
.tiles.compact .d{display:none}
.grid.compact .cbody p{display:none}

/* ---------- clients */
.status{color:var(--accent)}
.mini-agents{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

/* ---------- agents */
.agent{background:var(--surface);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:6px;min-height:200px}
.agent.paused{opacity:.55}
.agent .top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--fg-3)}
.dot{display:inline-flex;align-items:center;gap:7px;color:var(--accent)}
.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(143,175,144,.2)}
.agent.paused .dot{color:var(--fg-3)}
.agent.paused .dot::before{box-shadow:none}
.agent h3{font-weight:300;font-size:1.6rem;line-height:1.05;letter-spacing:-.03em;color:var(--fg);margin-top:6px}
.agent .role{color:var(--fg-2)}
.agent p{font-size:.84rem}
.agent.compact{min-height:0}
.agent.compact h3{font-size:1.25rem}
.skill{background:var(--surface);border:1px solid var(--line);padding:14px 16px}
.skill h3{font-weight:400;font-size:.93rem;color:var(--fg);margin-bottom:4px}
.skill p{font-size:.8rem;color:var(--fg-3)}

/* ---------- filters */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chips button{color:var(--fg-2);padding:4px 10px;border:1px solid var(--line);background:var(--surface);transition:all var(--dur)}
.chips button:hover{color:var(--fg);border-color:var(--line-2)}
.chips button[aria-pressed=true]{color:var(--side);background:var(--accent);border-color:var(--accent)}
.empty{padding:48px 0;color:var(--fg-3)}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--side);padding:9px 16px;opacity:0;transition:all var(--dur) var(--ease);pointer-events:none;font-size:.85rem;z-index:40}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- mobile */
.menu-btn{display:none}
@media (max-width:860px){
  :root{--pad:14px}
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:260px;z-index:30;transform:translateX(-100%);transition:transform var(--dur) var(--ease)}
  body.menu aside{transform:none}
  body.menu::after{content:"";position:fixed;inset:0;background:rgba(15,24,33,.6);z-index:25}
  .menu-btn{display:block;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:34px;height:34px;flex:none}
  .bar{flex-wrap:wrap;gap:10px}
  .bar .title{flex:1}
  .search{width:100%;margin-left:0;order:3}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .mini-agents{grid-template-columns:1fr}
  .grid,.tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .cbody p{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <a class="brand" href="#home"><img src="brand/monogramma-muschio.svg" alt=""><span>Lo studio di<br>Alessio Granella</span></a>
    <nav class="nav" id="navMain"></nav>
    <nav class="nav" id="navCats"><h4 class="ui">Lavori</h4></nav>
    <div class="foot">Aggiornato il __DATE__<br>Al tuo fianco ad ogni passo.</div>
  </aside>

  <main>
    <div class="bar">
      <button class="menu-btn ui" id="menuBtn" aria-label="Menu">☰</button>
      <div class="title"><p class="eyebrow" id="eyebrow"></p><h1 id="h1"></h1></div>
      <label class="search"><input id="q" type="search" placeholder="Cerca lavori, clienti, file…" autocomplete="off"><kbd>/</kbd></label>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const DATA = /*__DATA__*/null;
const LOCAL = location.protocol === 'file:';
const BASE = '../../';
const HOME = '~/Desktop/Operativa/';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CL = Object.fromEntries(DATA.clients.map(c => [c.id, c]));
const CAT = Object.fromEntries(DATA.cats.map(c => [c.id, c]));
const localHref = p => BASE + p.split('/').map(encodeURIComponent).join('/');
const EXT = {PDF:'PDF', Pagina:'HTML', Excel:'XLSX', Testo:'MD', PowerPoint:'PPTX', Word:'DOCX', Cartella:'Dir', File:'File', Online:'Web'};
let q = '', sub = 'all';

/* ---------- pieces */
function primaryHref(it) {
  if (it.u) return it.u;
  if (it.p && LOCAL) return localHref(it.p);
  return null;
}
function thumb(it, cls = '') {
  if (it.i) return `<img class="${it.v ? 'v' : ''}" src="thumbs/${it.id}.webp" alt="" loading="lazy">`;
  return `<div class="ph c-${it.c} ${cls}"><span class="ui">${esc(CAT[it.c].n)}</span><b>${EXT[it.y] || it.y}</b></div>`;
}
function card(it) {
  const href = primaryHref(it);
  const acts = [];
  if (it.u) acts.push(`<a class="primary" href="${esc(it.u)}" target="_blank" rel="noopener">Online</a>`);
  if (it.p && LOCAL) acts.push(`<a href="${esc(localHref(it.p))}" target="_blank">${it.y === 'Cartella' ? 'Cartella' : 'File'}</a>`);
  if (it.p) acts.push(`<button data-copy="${esc(HOME + it.p)}">Percorso</button>`);
  const who = it.k ? `<button data-go="cliente/${it.k}">${esc(CL[it.k].n)}</button>` : '<span>Studio</span>';
  const th = href
    ? `<a class="thumb" href="${esc(href)}" target="_blank" rel="noopener">${thumb(it)}${it.u ? '<span class="badge live">Online</span>' : ''}</a>`
    : `<button class="thumb" data-copy="${esc(HOME + it.p)}" title="Copia percorso">${thumb(it)}</button>`;
  return `<article class="card">${th}
    <div class="cbody"><div class="meta">${who}<span>· ${esc(it.y)}</span></div>
    <h3>${esc(it.t)}</h3>${it.d ? `<p>${esc(it.d)}</p>` : ''}
    <div class="acts">${acts.join('')}</div></div></article>`;
}
function mosaic(list) {
  const pick = [...list.filter(x => x.i), ...list.filter(x => !x.i)].slice(0, 3);
  while (pick.length < 3) pick.push(null);
  return `<div class="mosaic">${pick.map(it => it ? thumb(it) : '<div class="ph"></div>').join('')}</div>`;
}
function agentCard(a, compact) {
  return `<article class="agent ${a.s !== 'Attivo' ? 'paused' : ''} ${compact ? 'compact' : ''}">
    <div class="top"><span class="ui dot">${esc(a.s)}</span><span class="ui">${esc(a.w)}</span></div>
    <h3>${esc(a.n)}</h3><p class="ui role">${esc(a.r)}</p>
    ${compact ? '' : `<p>${esc(a.d)}</p>`}
    <div class="acts">${a.o ? `<a href="${esc(a.o[1])}" target="_blank" rel="noopener">${esc(a.o[0])}</a>` : ''}<a href="${esc(a.u)}" target="_blank" rel="noopener">Routine</a></div>
  </article>`;
}
const grid = (list, cls = '') => list.length ? `<div class="grid ${cls}">${list.map(card).join('')}</div>` : '<p class="empty">Niente da mostrare.</p>';
const recent = n => DATA.items.filter(x => x.m).sort((a, b) => b.m - a.m).slice(0, n);

/* ---------- views */
const VIEWS = {
  home() {
    const h = new Date().getHours();
    head((h < 13 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera') + ', Alessio', 'Lo studio');
    const active = DATA.clients.filter(c => ['Attivo', 'Trattativa'].includes(c.s));
    return `
      <div class="stats">
        <a class="stat" href="#cat/all"><b>${DATA.items.length}</b><span class="ui">lavori</span></a>
        <a class="stat" href="#clienti"><b>${DATA.clients.length}</b><span class="ui">clienti</span></a>
        <a class="stat" href="#online"><b>${DATA.online}</b><span class="ui">online</span></a>
        <a class="stat dark" href="#agenti"><b>${DATA.agents.filter(a => a.s === 'Attivo').length}</b><span class="ui">agenti attivi</span></a>
      </div>
      <div class="sec"><h2>Ultimi lavori</h2><a class="ui" href="#cat/all">Vedi tutti</a></div>
      ${grid(recent(window.innerWidth > 1700 ? 6 : 5), 'compact')}
      <div class="sec"><h2>Categorie</h2></div>
      <div class="tiles compact">${DATA.cats.map(c => {
        const list = DATA.items.filter(x => x.c === c.id);
        return `<a class="tile" href="#cat/${c.id}">${mosaic(list)}<div class="tb"><h3>${esc(c.n)}</h3><span class="n">${list.length}</span></div><p class="d">${esc(c.d)}</p></a>`;
      }).join('')}</div>
      <div class="sec"><h2>Agenti</h2><a class="ui" href="#agenti">Dettagli</a></div>
      <div class="mini-agents">${DATA.agents.map(a => agentCard(a, true)).join('')}</div>`;
  },
  cat(id) {
    const list = id === 'all' ? DATA.items : DATA.items.filter(x => x.c === id);
    head(id === 'all' ? 'Tutti i lavori' : CAT[id].n, id === 'all' ? `${list.length} voci` : CAT[id].d);
    const ks = [...new Set(list.map(x => x.k || '_'))];
    const shown = sub === 'all' ? list : list.filter(x => (x.k || '_') === sub);
    const chips = ks.length > 1 ? `<div class="chips ui">${[['all', 'Tutti'], ...ks.map(k => [k, k === '_' ? 'Studio' : CL[k].n])]
      .map(([k, n]) => `<button data-sub="${k}" aria-pressed="${sub === k}">${esc(n)}</button>`).join('')}</div>` : '';
    return chips + grid(shown);
  },
  online() {
    head('Online', 'Tutto quello che è pubblicato');
    return grid(DATA.items.filter(x => x.u));
  },
  clienti() {
    head('Clienti', `${DATA.clients.length} tra diretti, collaborazioni e DROP`);
    const groups = [['Clienti diretti', c => c.r === 'Cliente diretto'], ['Collaborazioni', c => ['Collaborazione', 'Agenzia'].includes(c.r)], ['Tramite DROP', c => c.r === 'Via DROP']];
    return groups.map(([t, f]) => `<div class="sec"><h2>${t}</h2></div><div class="tiles">${DATA.clients.filter(f).map(c => {
      const list = DATA.items.filter(x => x.k === c.id);
      return `<a class="tile client" href="#cliente/${c.id}">${mosaic(list)}
        <div class="tb"><h3>${esc(c.n)}</h3><span class="ui status">${esc(c.s)}</span></div>
        <p class="d">${esc(c.d)} · ${list.length} ${list.length === 1 ? 'lavoro' : 'lavori'}</p></a>`;
    }).join('')}</div>`).join('');
  },
  cliente(id) {
    const c = CL[id];
    head(c.n, `${c.r} · ${c.s}`);
    const folder = LOCAL ? `<a class="ui" href="${esc(localHref(c.p))}" target="_blank">Apri cartella</a>` : `<button class="ui" data-copy="${esc(HOME + c.p)}">Copia percorso cartella</button>`;
    return `<div class="sec" style="margin-top:0"><p class="lead" style="margin:0">${esc(c.d)}</p>${folder}</div>` + grid(DATA.items.filter(x => x.k === id));
  },
  agenti() {
    head('Agenti', 'Routine nel cloud e skill');
    return `<div class="sec"><h2>Routine</h2></div><div class="mini-agents">${DATA.agents.map(a => agentCard(a)).join('')}</div>
      <div class="sec"><h2>Skill</h2></div><div class="mini-agents">${DATA.skills.map(s => `<div class="skill"><h3>${esc(s.n)}</h3><p>${esc(s.d)}</p></div>`).join('')}</div>`;
  },
  search() {
    const t = q.toLowerCase();
    const res = DATA.items.filter(it => [it.t, it.d, it.k ? CL[it.k].n : '', CAT[it.c].n, it.y, it.p].join(' ').toLowerCase().includes(t));
    const cl = DATA.clients.filter(c => c.n.toLowerCase().includes(t));
    head(`«${q}»`, `${res.length} risultati`);
    return (cl.length ? `<div class="chips ui">${cl.map(c => `<button data-go="cliente/${c.id}">Cliente: ${esc(c.n)} →</button>`).join('')}</div>` : '') + grid(res);
  },
};

function head(title, eyebrow) { $('#h1').textContent = title; $('#eyebrow').textContent = eyebrow; }

function navs() {
  const r = location.hash.slice(1) || 'home';
  const main = [['home', 'Panoramica', ''], ['clienti', 'Clienti', DATA.clients.length], ['agenti', 'Agenti', DATA.agents.length], ['online', 'Online', DATA.online], ['cat/all', 'Tutti i lavori', DATA.items.length]];
  $('#navMain').innerHTML = main.map(([h, n, c]) => `<a href="#${h}" class="${r === h || (h === 'clienti' && r.startsWith('cliente/')) ? 'on' : ''}">${n}<small>${c}</small></a>`).join('');
  $('#navCats').innerHTML = '<h4 class="ui">Categorie</h4>' + DATA.cats.map(c => `<a href="#cat/${c.id}" class="${r === 'cat/' + c.id ? 'on' : ''}">${esc(c.n)}<small>${c.count}</small></a>`).join('');
}

function route() {
  const r = location.hash.slice(1) || 'home';
  const [name, arg] = r.split('/');
  let html;
  if (q) html = VIEWS.search();
  else if (VIEWS[name] && (name !== 'cat' || arg === 'all' || CAT[arg]) && (name !== 'cliente' || CL[arg])) html = VIEWS[name](arg);
  else html = VIEWS.home();
  $('#view').innerHTML = html;
  navs();
  document.body.classList.remove('menu');
}

addEventListener('hashchange', () => { q = ''; $('#q').value = ''; sub = 'all'; route(); scrollTo(0, 0); });
$('#q').addEventListener('input', e => { q = e.target.value.trim(); route(); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') { $('#q').value = ''; q = ''; route(); }
});
$('#menuBtn').addEventListener('click', () => document.body.classList.toggle('menu'));
document.addEventListener('click', e => {
  if (document.body.classList.contains('menu') && !e.target.closest('aside,#menuBtn')) document.body.classList.remove('menu');
  const t = e.target.closest('[data-copy],[data-go],[data-sub]');
  if (!t) return;
  if (t.dataset.copy) { e.preventDefault(); copy(t.dataset.copy); }
  else if (t.dataset.go) { e.preventDefault(); location.hash = t.dataset.go; }
  else if (t.dataset.sub) { sub = t.dataset.sub; route(); }
});
function copy(text) {
  const ok = () => toast('Percorso copiato: incollalo in Finder → Vai → Vai alla cartella');
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok, () => fb(text)); else fb(text);
  function fb(t) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); ok(); } catch (_) { toast(t); } a.remove(); }
}
let tt; function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2400); }
route();
</script>
</body>
</html>
