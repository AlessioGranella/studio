<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lo studio di Alessio Granella</title>
<link rel="icon" href="brand/monogramma-rust.svg">
<style>
@font-face{font-family:'Augustina';src:url('font/DTAugustinaSlab-3Light.otf') format('opentype');font-weight:300;font-display:swap}
@font-face{font-family:'Augustina';src:url('font/DTAugustinaSlab-3Regular.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'Augustina';src:url('font/DTAugustinaSlab-3Medium.otf') format('opentype');font-weight:500;font-display:swap}
:root{
  --ag-paper:#F0EFEE;--ag-soft:#DFDAD5;--ag-ink:#1A2B1E;--ag-verde:#243728;--ag-rust:#D14124;
  --ag-muschio:#8FAF90;--ag-body:#344238;--ag-muted:#5D6A60;--ag-line:#C8C6C2;--ag-line-dark:#485349;
  --ag-on-dark:#E4E8E4;--ag-on-dark-muted:#ADB8AE;
  --ag-font:'Augustina',Georgia,'Times New Roman',serif;
  --side:256px;--pad:32px;
  --ease:cubic-bezier(.2,.7,.2,1);--dur:.18s;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ag-soft);color:var(--ag-body);font-family:var(--ag-font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;background:none;border:0;cursor:pointer;color:inherit}
.ui{font-size:.72rem;font-weight:500;text-transform:uppercase;letter-spacing:.11em}
.eyebrow{font-size:.68rem;font-weight:500;text-transform:uppercase;letter-spacing:.15em;color:var(--ag-rust)}
em{font-style:normal;color:var(--ag-rust)}

/* ---------- layout */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
aside{background:var(--ag-ink);color:var(--ag-on-dark-muted);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:24px 0}
.brand{display:flex;align-items:center;gap:12px;padding:0 24px 24px;border-bottom:1px solid var(--ag-line-dark)}
.brand img{width:30px;height:30px}
.brand span{color:var(--ag-on-dark);font-size:.95rem;line-height:1.15}
.nav{padding:16px 0;border-bottom:1px solid var(--ag-line-dark)}
.nav:last-of-type{border-bottom:0}
.nav h4{padding:4px 24px 8px;color:var(--ag-on-dark-muted);opacity:.7}
.nav a{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 24px;font-size:.95rem;color:var(--ag-on-dark-muted);border-left:2px solid transparent}
.nav a:hover{color:var(--ag-on-dark)}
.nav a.on{color:var(--ag-on-dark);border-left-color:var(--ag-muschio);background:rgba(143,175,144,.08)}
.nav a small{font-size:.72rem;opacity:.7}
aside .foot{margin-top:auto;padding:16px 24px 0;font-size:.8rem;opacity:.7}

main{min-width:0;padding:0 var(--pad) 48px}
.bar{position:sticky;top:0;z-index:5;background:var(--ag-soft);display:flex;align-items:center;gap:24px;padding:20px 0 16px;border-bottom:1px solid var(--ag-line)}
.bar .title{min-width:0}
.bar h1{font-weight:300;font-size:clamp(1.6rem,2.6vw,2.3rem);letter-spacing:-.035em;line-height:1;color:var(--ag-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .title p{margin-top:6px}
.search{margin-left:auto;display:flex;align-items:center;gap:10px;border:1px solid var(--ag-line);background:var(--ag-paper);padding:0 14px;width:min(380px,40vw);height:42px}
.search:focus-within{border-color:var(--ag-ink)}
.search input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:1rem;color:var(--ag-ink);min-width:0}
.search kbd{font-family:inherit;font-size:.7rem;color:var(--ag-muted);border:1px solid var(--ag-line);padding:1px 6px}

.view{padding-top:24px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:28px 0 14px}
.sec:first-child{margin-top:0}
.sec h2{font-weight:300;font-size:1.5rem;letter-spacing:-.03em;color:var(--ag-ink)}
.sec a,.sec button{color:var(--ag-muted)}
.sec a:hover,.sec button:hover{color:var(--ag-rust)}
.lead{max-width:62ch;margin:-4px 0 18px;color:var(--ag-muted)}

/* ---------- stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--ag-paper);border:1px solid var(--ag-line);padding:16px 18px;display:flex;align-items:baseline;gap:12px}
.stat b{font-weight:300;font-size:2.4rem;line-height:1;letter-spacing:-.04em;color:var(--ag-ink)}
.stat.dark{background:var(--ag-ink);border-color:var(--ag-ink);color:var(--ag-on-dark-muted)}
.stat.dark b{color:var(--ag-on-dark)}

/* ---------- cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.card{background:var(--ag-paper);border:1px solid var(--ag-line);display:flex;flex-direction:column;transition:border-color var(--dur) var(--ease);position:relative;min-width:0}
.card:hover{border-color:var(--ag-ink)}
.thumb{aspect-ratio:16/10;background:var(--ag-soft);overflow:hidden;border-bottom:1px solid var(--ag-line);display:block;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;transition:transform .4s var(--ease)}
.thumb img.v,.mosaic img.v{object-fit:contain;object-position:center;padding:10px 0;background:var(--ag-soft)}
.card:hover .thumb img{transform:scale(1.03)}
.ph{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:14px 16px;background:var(--ag-verde);color:var(--ag-on-dark-muted)}
.ph b{font-weight:300;font-size:2.6rem;letter-spacing:-.04em;line-height:1;color:var(--ag-on-dark)}
.ph.c-proposte{background:var(--ag-ink)}
.ph.c-business{background:var(--ag-verde)}
.ph.c-finanza{background:#0F1821}
.badge{position:absolute;top:10px;left:10px;background:var(--ag-paper);color:var(--ag-ink);padding:3px 7px;font-size:.62rem;font-weight:500;letter-spacing:.11em;text-transform:uppercase}
.badge.live{background:var(--ag-rust);color:#fff}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.cbody .meta{display:flex;flex-wrap:wrap;gap:2px 8px;color:var(--ag-muted);font-size:.62rem;font-weight:500;letter-spacing:.11em;text-transform:uppercase}
.cbody .meta button{color:var(--ag-ink);font-size:inherit;letter-spacing:inherit;font-weight:inherit;text-transform:inherit}
.cbody .meta button:hover{color:var(--ag-rust)}
.cbody h3{font-weight:400;font-size:1.02rem;line-height:1.25;color:var(--ag-ink);letter-spacing:-.01em}
.cbody p{font-size:.85rem;color:var(--ag-muted);line-height:1.4}
.acts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:auto;padding-top:10px}
.acts a,.acts button{font-size:.64rem;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--ag-ink);border-bottom:1px solid var(--ag-line);padding-bottom:1px}
.acts a:hover,.acts button:hover{color:var(--ag-rust);border-bottom-color:var(--ag-rust)}
.acts .primary{color:var(--ag-rust);border-bottom-color:var(--ag-rust)}

/* ---------- category tiles (panoramica) */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tiles.compact .d{display:none}
.grid.compact .cbody p{display:none}
.tile{background:var(--ag-paper);border:1px solid var(--ag-line);display:flex;flex-direction:column;transition:border-color var(--dur) var(--ease)}
.tile:hover{border-color:var(--ag-ink)}
.mosaic{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;aspect-ratio:16/7;background:var(--ag-line);overflow:hidden}
.mosaic>*:first-child{grid-row:1/3}
.mosaic img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.mosaic .ph{padding:10px 12px;justify-content:flex-end}
.mosaic .ph span{display:none}
.mosaic .ph b{font-size:1.6rem}
.tile .tb{padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tile h3{font-weight:400;font-size:1.05rem;color:var(--ag-ink);letter-spacing:-.01em}
.tile .n{font-weight:300;font-size:1.6rem;color:var(--ag-ink);letter-spacing:-.04em;line-height:1}
.tile .d{padding:0 14px 14px;font-size:.85rem;color:var(--ag-muted);margin-top:-6px}

/* ---------- clients */
.client .cbody h3{font-size:1.3rem;font-weight:300;letter-spacing:-.03em}
.status{color:var(--ag-rust)}
.mini-agents{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

/* ---------- agents */
.agent{background:var(--ag-ink);border:1px solid var(--ag-ink);color:var(--ag-on-dark-muted);padding:20px;display:flex;flex-direction:column;gap:8px;min-height:220px}
.agent.paused{background:var(--ag-verde);border-color:var(--ag-verde);opacity:.75}
.agent .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dot{display:inline-flex;align-items:center;gap:7px;color:var(--ag-muschio)}
.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.agent.paused .dot{color:var(--ag-on-dark-muted)}
.agent h3{font-weight:300;font-size:2.1rem;line-height:1;letter-spacing:-.035em;color:var(--ag-on-dark)}
.agent .role{color:var(--ag-on-dark)}
.agent p{font-size:.9rem}
.agent .acts a{color:var(--ag-on-dark);border-bottom-color:var(--ag-line-dark)}
.agent .acts a:hover{color:var(--ag-muschio);border-bottom-color:var(--ag-muschio)}
.agent.compact{min-height:0}
.agent.compact h3{font-size:1.5rem}
.skill{background:var(--ag-paper);border:1px solid var(--ag-line);padding:16px 18px}
.skill h3{font-weight:400;font-size:1.02rem;color:var(--ag-ink);margin-bottom:4px}
.skill p{font-size:.85rem;color:var(--ag-muted)}

/* ---------- filters within a view */
.chips{display:flex;flex-wrap:wrap;gap:6px 18px;margin:-4px 0 18px}
.chips button{color:var(--ag-muted);padding:3px 0;border-bottom:1px solid transparent}
.chips button:hover{color:var(--ag-ink)}
.chips button[aria-pressed=true]{color:var(--ag-ink);border-bottom-color:var(--ag-rust)}
.empty{padding:48px 0;color:var(--ag-muted)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ag-ink);color:var(--ag-on-dark);padding:10px 18px;opacity:0;transition:all var(--dur) var(--ease);pointer-events:none;font-size:.9rem;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- mobile */
.menu-btn{display:none}
@media (max-width:860px){
  :root{--pad:16px}
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:280px;z-index:30;transform:translateX(-100%);transition:transform var(--dur) var(--ease)}
  body.menu aside{transform:none}
  body.menu::after{content:"";position:fixed;inset:0;background:rgba(15,24,33,.4);z-index:25}
  .menu-btn{display:block;border:1px solid var(--ag-line);background:var(--ag-paper);width:42px;height:42px;flex:none}
  .bar{flex-wrap:wrap;gap:12px}
  .bar .title{flex:1}
  .search{width:100%;margin-left:0;order:3}
  .stats{grid-template-columns:repeat(2,1fr)}
  .mini-agents{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .cbody p{display:none}
}
</style>
</head>

</div>
<div class="toast" id="toast" role="status"></div>

  },
  cat(id) {
    const list = id === 'all' ? DATA.items : DATA.items.filter(x => x.c === id);
    head(id === 'all' ? 'Tutti i lavori' : CAT[id].n, id === 'all' ? `${list.length} voci` : CAT[id].d);
    const ks = [...new Set(list.map(x => x.k || '_'))];
    const shown = sub === 'all' ? list : list.filter(x => (x.k || '_') === sub);
    const chips = ks.length > 1 ? `<div class="chips ui">${[['all', 'Tutti'], ...ks.map(k => [k, k === '_' ? 'Studio' : CL[k].n])]
      .map(([k, n]) => `<button data-sub="${k}" aria-pressed="${sub === k}">${esc(n)}</button>`).join('')}</div>` : '';
    return chips + grid(shown);
  },
  online() {
    head('Online', 'Tutto quello che è pubblicato');
    return grid(DATA.items.filter(x => x.u));
  },
  clienti() {
    head('Clienti', `${DATA.clients.length} tra diretti, collaborazioni e DROP`);
    const groups = [['Clienti diretti', c => c.r === 'Cliente diretto'], ['Collaborazioni', c => ['Collaborazione', 'Agenzia'].includes(c.r)], ['Tramite DROP', c => c.r === 'Via DROP']];
    return groups.map(([t, f]) => `<div class="sec"><h2>${t}</h2></div><div class="tiles">${DATA.clients.filter(f).map(c => {
      const list = DATA.items.filter(x => x.k === c.id);
      return `<a class="tile client" href="#cliente/${c.id}">${mosaic(list)}
        <div class="tb"><h3>${esc(c.n)}</h3><span class="ui status">${esc(c.s)}</span></div>
        <p class="d">${esc(c.d)} · ${list.length} ${list.length === 1 ? 'lavoro' : 'lavori'}</p></a>`;
    }).join('')}</div>`).join('');
  },
  cliente(id) {
    const c = CL[id];
    head(c.n, `${c.r} · ${c.s}`);
    const folder = LOCAL ? `<a class="ui" href="${esc(localHref(c.p))}" target="_blank">Apri cartella</a>` : `<button class="ui" data-copy="${esc(HOME + c.p)}">Copia percorso cartella</button>`;
    return `<div class="sec" style="margin-top:0"><p class="lead" style="margin:0">${esc(c.d)}</p>${folder}</div>` + grid(DATA.items.filter(x => x.k === id));
  },
  agenti() {
    head('Agenti', 'Routine nel cloud e skill');
    return `<div class="sec"><h2>Routine</h2></div><div class="mini-agents">${DATA.agents.map(a => agentCard(a)).join('')}</div>
      <div class="sec"><h2>Skill</h2></div><div class="mini-agents">${DATA.skills.map(s => `<div class="skill"><h3>${esc(s.n)}</h3><p>${esc(s.d)}</p></div>`).join('')}</div>`;
  },
  search() {
    const t = q.toLowerCase();
    const res = DATA.items.filter(it => [it.t, it.d, it.k ? CL[it.k].n : '', CAT[it.c].n, it.y, it.p].join(' ').toLowerCase().includes(t));
    const cl = DATA.clients.filter(c => c.n.toLowerCase().includes(t));
    head(`«${q}»`, `${res.length} risultati`);
    return (cl.length ? `<div class="chips ui">${cl.map(c => `<button data-go="cliente/${c.id}">Cliente: ${esc(c.n)} →</button>`).join('')}</div>` : '') + grid(res);
  },
};

function head(title, eyebrow) { $('#h1').textContent = title; $('#eyebrow').textContent = eyebrow; }

function navs() {
  const r = location.hash.slice(1) || 'home';
  const main = [['home', 'Panoramica', ''], ['clienti', 'Clienti', DATA.clients.length], ['agenti', 'Agenti', DATA.agents.length], ['online', 'Online', DATA.online], ['cat/all', 'Tutti i lavori', DATA.items.length]];
  $('#navMain').innerHTML = main.map(([h, n, c]) => `<a href="#${h}" class="${r === h || (h === 'clienti' && r.startsWith('cliente/')) ? 'on' : ''}">${n}<small>${c}</small></a>`).join('');
  $('#navCats').innerHTML = '<h4 class="ui">Categorie</h4>' + DATA.cats.map(c => `<a href="#cat/${c.id}" class="${r === 'cat/' + c.id ? 'on' : ''}">${esc(c.n)}<small>${c.count}</small></a>`).join('');
}

function route() {
  const r = location.hash.slice(1) || 'home';
  const [name, arg] = r.split('/');
  let html;
  if (q) html = VIEWS.search();
  else if (VIEWS[name] && (name !== 'cat' || arg === 'all' || CAT[arg]) && (name !== 'cliente' || CL[arg])) html = VIEWS[name](arg);
  else html = VIEWS.home();
  $('#view').innerHTML = html;
  navs();
  document.body.classList.remove('menu');
}

addEventListener('hashchange', () => { q = ''; $('#q').value = ''; sub = 'all'; route(); scrollTo(0, 0); });
$('#q').addEventListener('input', e => { q = e.target.value.trim(); route(); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') { $('#q').value = ''; q = ''; route(); }
});
$('#menuBtn').addEventListener('click', () => document.body.classList.toggle('menu'));
document.addEventListener('click', e => {
  if (document.body.classList.contains('menu') && !e.target.closest('aside,#menuBtn')) document.body.classList.remove('menu');
  const t = e.target.closest('[data-copy],[data-go],[data-sub]');
  if (!t) return;
  if (t.dataset.copy) { e.preventDefault(); copy(t.dataset.copy); }
  else if (t.dataset.go) { e.preventDefault(); location.hash = t.dataset.go; }
  else if (t.dataset.sub) { sub = t.dataset.sub; route(); }
});
function copy(text) {
  const ok = () => toast('Percorso copiato: incollalo in Finder → Vai → Vai alla cartella');
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok, () => fb(text)); else fb(text);
  function fb(t) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); ok(); } catch (_) { toast(t); } a.remove(); }
}
let tt; function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2400); }
route();
</script>
</body>
</html>
