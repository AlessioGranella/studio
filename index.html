<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F6F4">
<title>Lo studio di Alessio Granella</title>
<link rel="icon" href="brand/monogramma-rust.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Augustina';src:url('font/DTAugustinaSlab-3Light.otf') format('opentype');font-weight:300;font-display:swap}
@font-face{font-family:'Augustina';src:url('font/DTAugustinaSlab-3Regular.otf') format('opentype');font-weight:400;font-display:swap}
:root{
  --bg:#F6F6F4;--panel:#FFFFFF;--subtle:#F1F0EE;--hover:#EDECE9;
  --line:#E7E5E1;--line-2:#D9D6D1;
  --fg:#16201A;--fg-2:#4B544E;--fg-3:#868E88;
  --brand:#243728;--brand-2:#1A2B1E;--rust:#D14124;
  --ok:#2F7A4B;--ok-bg:#E6F2EA;--warn:#A86410;--warn-bg:#FBF0DE;--info:#2E5E8C;--info-bg:#E5EEF7;--mute-bg:#EEEEEC;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Augustina',Georgia,serif;
  --r:12px;--r-sm:8px;
  --sh:0 1px 2px rgba(22,32,26,.05);
  --sh-h:0 8px 24px -6px rgba(22,32,26,.14),0 2px 6px rgba(22,32,26,.06);
  --sidew:248px;--pad:32px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg-2);font-family:var(--sans);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
a{color:inherit;text-decoration:none}
button{font:inherit;background:none;border:0;cursor:pointer;color:inherit}
svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- layout */
.app{display:grid;grid-template-columns:var(--sidew) 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:16px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--brand);display:grid;place-items:center}
.brand .logo img{width:20px;height:20px}
.brand b{display:block;color:var(--fg);font-weight:600;font-size:.88rem;line-height:1.2}
.brand small{color:var(--fg-3);font-size:.75rem}
.nav{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.nav h4{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);padding:8px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);color:var(--fg-2);font-weight:500;transition:background .15s,color .15s}
.nav a:hover{background:var(--subtle);color:var(--fg)}
.nav a.on{background:var(--subtle);color:var(--fg)}
.nav a.on svg{color:var(--rust)}
.nav a span:not(.cdot){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav a small{font-size:.72rem;color:var(--fg-3);font-variant-numeric:tabular-nums}
.nav a.on small{color:var(--fg-2)}
.cdot{width:8px;height:8px;border-radius:3px;flex:none;margin:0 4px}
aside .foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line);font-size:.75rem;color:var(--fg-3)}

main{min-width:0;padding:0 var(--pad) 48px}
.bar{position:sticky;top:0;z-index:5;background:rgba(246,246,244,.85);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);display:flex;align-items:center;gap:16px;padding:16px 0}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:38px;width:min(440px,100%);box-shadow:var(--sh);transition:border-color .15s,box-shadow .15s;color:var(--fg-3)}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(36,55,40,.1)}
.search input{flex:1;border:0;outline:0;background:transparent;font:inherit;color:var(--fg);min-width:0}
.search input::placeholder{color:var(--fg-3)}
.search kbd{font:inherit;font-size:.7rem;color:var(--fg-3);background:var(--subtle);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.bar .me{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--fg-3);font-size:.8rem}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--rust);color:#fff;display:grid;place-items:center;font-weight:600;font-size:.75rem}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:12px 0 22px}
.head p{color:var(--fg-3);font-size:.82rem;margin-bottom:4px}
.head h1{font-family:var(--serif);font-weight:300;font-size:clamp(1.9rem,3vw,2.5rem);letter-spacing:-.03em;line-height:1.05;color:var(--fg)}

.sec{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:30px 0 12px}
.sec:first-child{margin-top:0}
.sec h2{font-size:.95rem;font-weight:600;color:var(--fg);letter-spacing:-.01em}
.link{display:inline-flex;align-items:center;gap:4px;color:var(--fg-2);font-weight:500;font-size:.82rem}
.link:hover{color:var(--fg)}
.link svg{width:14px;height:14px}

/* ---------- stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);display:flex;justify-content:space-between;align-items:flex-start;transition:box-shadow .2s var(--ease),transform .2s var(--ease)}
.stat:hover{box-shadow:var(--sh-h);transform:translateY(-1px)}
.stat span{display:block;color:var(--fg-3);font-weight:500;font-size:.8rem}
.stat b{display:block;font-size:1.75rem;font-weight:600;letter-spacing:-.03em;color:var(--fg);margin-top:4px;font-variant-numeric:tabular-nums}
.stat i{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--subtle);color:var(--fg-2)}
.stat.accent i{background:var(--ok-bg);color:var(--ok)}

/* ---------- cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);transition:box-shadow .2s var(--ease),transform .2s var(--ease),border-color .2s;min-width:0}
.card:hover{box-shadow:var(--sh-h);transform:translateY(-2px);border-color:var(--line-2)}
.thumb{aspect-ratio:16/10;background:var(--subtle);overflow:hidden;display:block;position:relative;width:100%;padding:12px 12px 0}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;border-radius:6px 6px 0 0;box-shadow:0 0 0 1px rgba(22,32,26,.06),0 2px 8px rgba(22,32,26,.08);transition:transform .5s var(--ease)}
.card:hover .thumb img{transform:translateY(-3px)}
.thumb img.v{object-fit:contain;object-position:center bottom;box-shadow:none;border-radius:0;filter:drop-shadow(0 2px 6px rgba(22,32,26,.14))}
.ph{width:100%;height:100%;display:grid;place-items:center;background:var(--panel);border-radius:6px 6px 0 0;box-shadow:0 0 0 1px rgba(22,32,26,.06);color:var(--fg-3)}
.ph div{display:flex;flex-direction:column;align-items:center;gap:8px}
.ph svg{width:28px;height:28px;stroke-width:1.4}
.ph b{font-size:.68rem;font-weight:600;letter-spacing:.08em}
.badge{position:absolute;top:20px;left:20px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);color:var(--fg);padding:3px 8px;border-radius:999px;font-size:.7rem;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#2FB15C}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1;border-top:1px solid var(--line)}
.meta{font-size:.74rem;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta button{color:var(--fg-2);font-weight:500}
.meta button:hover{color:var(--fg);text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;max-width:100%;font-size:.72rem;font-weight:500;color:var(--fg-2);background:var(--subtle);border-radius:999px;padding:2px 9px 2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.pill:hover{background:var(--hover);color:var(--fg)}
.pill .cdot{margin:0;width:7px;height:7px;border-radius:50%}
.cbody h3{font-size:.9rem;font-weight:600;line-height:1.35;color:var(--fg);letter-spacing:-.005em}
.cbody p{font-size:.8rem;color:var(--fg-3);line-height:1.45}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.type{display:inline-flex;align-items:center;gap:6px;color:var(--fg-3);font-size:.75rem;font-weight:500}
.type svg{width:14px;height:14px}
.card{position:relative}
.acts{position:absolute;top:20px;right:20px;display:flex;gap:4px;transition:opacity .15s}
@media (hover:hover){.card .acts{opacity:0}.card:hover .acts,.card:focus-within .acts{opacity:1}}
.ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--fg);background:rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(22,32,26,.18);transition:background .15s,color .15s}
.ib:hover{background:#fff;color:var(--rust)}
.ib.primary{background:var(--brand);color:#fff}
.ib.primary:hover{background:var(--brand-2);color:#fff}
.ib svg{width:15px;height:15px}

/* ---------- tiles (categorie, clienti) */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);transition:box-shadow .2s var(--ease),transform .2s var(--ease)}
.tile:hover{box-shadow:var(--sh-h);transform:translateY(-2px)}
.mosaic{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;aspect-ratio:16/7;background:var(--line);overflow:hidden}
.mosaic>*:first-child{grid-row:1/3}
.mosaic img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.mosaic .ph svg{width:20px;height:20px}
.mosaic .ph b{display:none}
.tile .tb{padding:12px 14px;display:flex;align-items:center;gap:10px}
.tile h3{font-size:.9rem;font-weight:600;color:var(--fg);flex:1;min-width:0}
.tile .n{font-size:.75rem;font-weight:600;color:var(--fg-2);background:var(--subtle);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.tile .d{padding:0 14px 14px;font-size:.8rem;color:var(--fg-3);margin-top:-6px}
.tiles.compact .d{display:none}
.grid.compact .cbody p{display:none}
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.initials{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:.72rem;flex:none}
.status{font-size:.7rem;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.s-Attivo{color:var(--ok);background:var(--ok-bg)}
.s-Trattativa,.s-Brief{color:var(--warn);background:var(--warn-bg)}
.s-Continuativo{color:var(--info);background:var(--info-bg)}
.s-Consegnato,.s-In.pausa{color:var(--fg-2);background:var(--mute-bg)}

/* ---------- agents */
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.agent{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;display:flex;flex-direction:column;gap:10px}
.agent .top{display:flex;align-items:center;gap:12px}
.agent .bot{width:40px;height:40px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center}
.agent.paused .bot{background:var(--line-2)}
.agent .bot svg{width:20px;height:20px}
.agent h3{font-size:1rem;font-weight:600;color:var(--fg)}
.agent .role{font-size:.8rem;color:var(--fg-3)}
.agent .top .status{margin-left:auto}
.agent p{font-size:.82rem}
.agent .when{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--fg-2);background:var(--subtle);border-radius:8px;padding:6px 10px}
.agent .when svg{width:14px;height:14px}
.agent .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:.8rem;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--fg);transition:background .15s,border-color .15s}
.btn:hover{background:var(--subtle);border-color:var(--line-2)}
.btn.dark{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.dark:hover{background:var(--brand-2)}
.btn svg{width:14px;height:14px}
.agent.compact p{display:none}
.skill{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:flex;gap:12px}
.skill i{width:34px;height:34px;border-radius:9px;background:var(--subtle);display:grid;place-items:center;color:var(--fg-2);flex:none}
.skill h3{font-size:.88rem;font-weight:600;color:var(--fg);margin-bottom:2px}
.skill p{font-size:.8rem;color:var(--fg-3)}

/* ---------- filtri */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.chips button{font-size:.8rem;font-weight:500;color:var(--fg-2);padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);transition:all .15s}
.chips button:hover{border-color:var(--line-2);color:var(--fg)}
.chips button[aria-pressed=true]{background:var(--fg);border-color:var(--fg);color:#fff}
.empty{padding:56px 0;text-align:center;color:var(--fg-3)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:var(--fg);color:#fff;padding:10px 16px;border-radius:10px;box-shadow:var(--sh-h);opacity:0;transition:all .2s var(--ease);pointer-events:none;font-size:.82rem;z-index:40}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


/* ---------- elenchi ordinati (categorie, clienti, agenti) */
.split{margin-top:30px;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.rows2{display:grid;grid-template-columns:1fr 1fr}
.rowlink{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);transition:background .15s;min-width:0}
.rows2 .rowlink:nth-child(odd){border-right:1px solid var(--line)}
.rowlink:hover{background:var(--subtle)}
.rowlink .ic{width:32px;height:32px;border-radius:8px;background:var(--subtle);color:var(--fg-2);display:grid;place-items:center;flex:none}
.rowlink:hover .ic{background:var(--panel)}
.rowlink .tx{flex:1;min-width:0}
.rowlink b{display:block;font-weight:600;color:var(--fg);font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowlink small{display:block;color:var(--fg-3);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowlink .n{font-size:.78rem;color:var(--fg-3);font-variant-numeric:tabular-nums}
.rowlink .chev{color:var(--line-2)}
.rowlink:hover .chev{color:var(--fg-2)}
.panel>.rowlink:last-child,.rows2 .rowlink:nth-last-child(-n+2):nth-child(odd),.rows2 .rowlink:last-child{border-bottom:0}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:.72rem;font-weight:600;color:var(--fg-3);text-transform:uppercase;letter-spacing:.05em;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--subtle)}
.t td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr{cursor:pointer;transition:background .15s}
.t tbody tr:hover{background:var(--subtle)}
.t .who{display:flex;align-items:center;gap:12px;min-width:0}
.t .who b{display:block;color:var(--fg);font-weight:600}
.t .who small{display:block;color:var(--fg-3);font-size:.76rem;max-width:46ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t .num{font-variant-numeric:tabular-nums;color:var(--fg-2)}
.t .group td{background:var(--bg);font-size:.72rem;font-weight:600;color:var(--fg-3);text-transform:uppercase;letter-spacing:.05em;padding:14px 16px 6px;cursor:default}
.t .group:hover{background:none}
.initials{background:var(--subtle)!important;color:var(--fg)!important}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
@media (max-width:700px){.rows2{grid-template-columns:1fr}.rows2 .rowlink:nth-child(odd){border-right:0}.rows2 .rowlink:nth-last-child(2):nth-child(odd){border-bottom:1px solid var(--line)}.t .hide-s{display:none}}

/* ---------- mobile */
.menu-btn{display:none}
@media (max-width:900px){
  :root{--pad:16px}
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:270px;z-index:30;transform:translateX(-100%);transition:transform .2s var(--ease);box-shadow:var(--sh-h)}
  body.menu aside{transform:none}
  body.menu::after{content:"";position:fixed;inset:0;background:rgba(22,32,26,.35);z-index:25}
  .menu-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);flex:none}
  .bar .me span{display:none}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .cols3{grid-template-columns:1fr}
  .grid,.tiles,.grid.compact{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
  .thumb{padding:8px 8px 0}.badge{top:14px;left:14px}.acts{top:14px;right:14px}
  .cbody p{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <a class="brand" href="#home"><span class="logo"><img src="brand/monogramma-muschio.svg" alt=""></span><span><b>Lo studio</b><small>Alessio Granella</small></span></a>
    <nav class="nav" id="navMain"></nav>
    <nav class="nav" id="navCats"></nav>
    <div class="foot">Aggiornato il 21/11/2026</div>
  </aside>

  <main>
    <div class="bar">
      <button class="menu-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Cerca lavori, clienti, file…" autocomplete="off"><kbd>/</kbd></label>
      <div class="me"><span>Alessio Granella</span><span class="avatar">AG</span></div>
    </div>
    <div class="head"><div><p id="eyebrow"></p><h1 id="h1"></h1></div><div id="headAct"></div></div>
    <div id="view"></div>
  </main>
</div>

function primaryHref(it) { return it.u || (it.p && LOCAL ? localHref(it.p) : null); }
function thumb(it) {
  if (it.i) return `<img class="${it.v ? 'v' : ''}" src="thumbs/${it.id}.webp" alt="" loading="lazy">`;
  return `<div class="ph"><div>${ico(TYPEICON[it.y] || 'file')}<b>${esc(it.y.toUpperCase())}</b></div></div>`;
}
function card(it) {
  const href = primaryHref(it);
  const acts = [];
  if (it.u) acts.push(`<a class="ib" href="${esc(it.u)}" target="_blank" rel="noopener" title="Apri online">${ico('ext')}</a>`);
  if (it.p && LOCAL) acts.push(`<a class="ib" href="${esc(localHref(it.p))}" target="_blank" title="${it.y === 'Cartella' ? 'Apri cartella' : 'Apri file'}">${ico(it.y === 'Cartella' ? 'folder' : 'file')}</a>`);
  if (it.p) acts.push(`<button class="ib" data-copy="${esc(HOME + it.p)}" title="Copia percorso">${ico('copy')}</button>`);
  const who = it.k ? `<button data-go="cliente/${it.k}">${esc(CL[it.k].n)}</button>` : 'Studio';
  const th = href
    ? `<a class="thumb" href="${esc(href)}" target="_blank" rel="noopener">${thumb(it)}${it.u ? '<span class="badge">Online</span>' : ''}</a>`
    : `<button class="thumb" data-copy="${esc(HOME + it.p)}" title="Copia percorso">${thumb(it)}</button>`;
  return `<article class="card">${th}<div class="acts">${acts.join('')}</div>
    <div class="cbody"><div class="meta">${who} · ${esc(it.y)}</div><h3>${esc(it.t)}</h3>${it.d ? `<p>${esc(it.d)}</p>` : ''}</div></article>`;
}
function mosaic(list) {
  const pick = [...list.filter(x => x.i), ...list.filter(x => !x.i)].slice(0, 3);
  while (pick.length < 3) pick.push(null);
  return `<div class="mosaic">${pick.map(it => it ? thumb(it) : '<div class="ph"></div>').join('')}</div>`;
}

}

function route() {
  const r = location.hash.slice(1) || 'home';
  const [name, arg] = r.split('/');
  let html;
  if (q) html = VIEWS.search();
  else if (VIEWS[name] && name !== 'search' && (name !== 'cat' || arg === 'all' || CAT[arg]) && (name !== 'cliente' || CL[arg])) html = VIEWS[name](arg);
  else html = VIEWS.home();
  $('#view').innerHTML = html;
  navs();
  document.body.classList.remove('menu');
}

document.addEventListener('keydown', e => {

  if (e.key === 'Escape') { $('#q').value = ''; q = ''; route(); }
});
$('#menuBtn').addEventListener('click', () => document.body.classList.toggle('menu'));
document.addEventListener('click', e => {
  if (document.body.classList.contains('menu') && !e.target.closest('aside,#menuBtn')) document.body.classList.remove('menu');
  const t = e.target.closest('[data-copy],[data-go],[data-sub]');
  if (!t) return;
  if (t.dataset.copy) { e.preventDefault(); copy(t.dataset.copy); }
  else if (t.dataset.go) { e.preventDefault(); location.hash = t.dataset.go; }
  else if (t.dataset.sub) { sub = t.dataset.sub; route(); }
});
function copy(text) {
  const ok = () => toast('Percorso copiato: incollalo in Finder → Vai → Vai alla cartella');
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok, () => fb(text)); else fb(text);
  function fb(t) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); ok(); } catch (_) { toast(t); } a.remove(); }
}
let tt; function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2400); }
route();
</script>
</body>
